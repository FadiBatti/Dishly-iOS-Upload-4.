
workflows:
  dishly-ios-upload:
    name: Upload Dishly IPA to App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: "Finjanak R7"

    environment:
      groups:
        - dishly_secrets

    scripts:
      - name: Download existing Dishly IPA
        script: |
          mkdir -p ipa
          gh release download dishly-ios-1.0 \
            --pattern "18967504293808-dishly-dishly-ios-6.ipa" \
            --dir ipa
          test -f "ipa/18967504293808-dishly-dishly-ios-6.ipa"

    artifacts:
      - ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
